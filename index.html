<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Для моего Sasha 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin:0; height:100vh;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  font-family:'Dancing Script', cursive;
  display:flex; justify-content:center; align-items:center; overflow:hidden;
  color:#e5e7eb;
}

canvas {
  position:fixed; top:0; left:0; width:100%; height:100%;
  z-index:0; pointer-events:none;
}

.card {
  position:relative; z-index:1;
  background:#111827;
  border-radius:20px;
  box-shadow:0 8px 30px rgba(0,0,0,0.5);
  max-width:420px; width:90%; min-height:520px;
  display:flex; flex-direction:column; overflow:hidden;
  padding-bottom:60px;
}

.slide {
  position:absolute; top:0; left:0; right:0; bottom:0;
  display:flex; flex-direction:column;
  opacity:0; pointer-events:none;
}

.slide.active {opacity:1; pointer-events:auto;}

.content {
  flex:1; padding:20px;
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  text-align:center; overflow-y:auto;
}

h1 {font-size:28px; margin:10px 0; color:#38bdf8;}
p {font-size:20px; color:#e5e7eb;}

.pin-box {display:flex; gap:10px; justify-content:center; margin:15px 0;}

.pin-box input {
  width:50px; height:60px; font-size:28px; text-align:center;
  border-radius:10px; border:2px solid #38bdf8;
  background:#1f2937; color:white;
}

.keyboard .row {display:flex; justify-content:center; margin:5px 0;}

.keyboard button {
  width:60px; height:60px; margin:5px;
  border:none; border-radius:10px;
  font-size:20px; background:#38bdf8; color:#000;
  cursor:pointer;
}

img {
  max-width:80%; border-radius:16px;
  box-shadow:0 4px 16px rgba(0,0,0,0.5);
  margin:15px 0;
}

.btn {
  padding:10px 20px; border:none; border-radius:10px;
  background:#38bdf8; color:#000; font-size:18px;
  cursor:pointer;
}

.nav-btns {
  display:flex; justify-content:space-between;
  padding:12px 20px; border-top:1px solid #333;
}

#musicToggle {
  position:absolute; bottom:10px; left:50%;
  transform:translateX(-50%);
  padding:10px 20px;
  border:none; border-radius:10px;
  background:#38bdf8; color:#000;
  cursor:pointer;
}

/* animasi */
@keyframes slideInRight {from{transform:translateX(100%);} to{transform:translateX(0);}}
@keyframes slideOutLeft {from{transform:translateX(0);} to{transform:translateX(-100%);}}
.slide-in-right {animation:slideInRight 0.6s forwards;}
.slide-out-left {animation:slideOutLeft 0.6s forwards;}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="card">

<!-- PIN -->
<div class="slide active" id="slide1">
<div class="content">
<h1>Введите PIN 🎂</h1>

<div class="pin-box">
<input type="password" maxlength="1">
<input type="password" maxlength="1">
<input type="password" maxlength="1">
<input type="password" maxlength="1">
</div>

<div class="keyboard">
<div class="row">
<button onclick="pressNum(1)">1</button>
<button onclick="pressNum(2)">2</button>
<button onclick="pressNum(3)">3</button>
</div>
<div class="row">
<button onclick="pressNum(4)">4</button>
<button onclick="pressNum(5)">5</button>
<button onclick="pressNum(6)">6</button>
</div>
<div class="row">
<button onclick="pressNum(7)">7</button>
<button onclick="pressNum(8)">8</button>
<button onclick="pressNum(9)">9</button>
</div>
<div class="row">
<button onclick="deleteNum()">⌫</button>
<button onclick="pressNum(0)">0</button>
<button onclick="checkPin()">✔</button>
</div>
</div>

<p style="font-size:14px;">* clue: год рождения</p>
<div id="errorMsg"></div>
</div>
</div>

<!-- SLIDE 2 -->
<div class="slide" id="slide2">
<div class="content">
<h1>С днём рождения, Sasha 🎂💖</h1>
<p>Сегодня особенный день...</p>
</div>
<div class="nav-btns">
<button class="btn" onclick="nextSlide()">➡</button>
</div>
</div>

<!-- SLIDE 3 -->
<div class="slide" id="slide3">
<div class="content">
<p>Я желаю тебе здоровья, счастья ✨</p>
<p>И чтобы всё у тебя было хорошо 💫</p>
</div>
<div class="nav-btns">
<button class="btn" onclick="prevSlide()">⬅</button>
<button class="btn" onclick="nextSlide()">➡</button>
</div>
</div>

<!-- SLIDE 4 -->
<div class="slide" id="slide4">
<div class="content">
<p>Hubby… 💖</p>
<p>Ты иногда вредный...</p>
<p>Но я всё равно тебя люблю 💕</p>
</div>
<div class="nav-btns">
<button class="btn" onclick="prevSlide()">⬅</button>
<button class="btn" onclick="nextSlide()">➡</button>
</div>
</div>

<!-- SLIDE 5 -->
<div class="slide" id="slide5">
<div class="content">
<p>Ты мой самый любимый человек 🥺</p>
<p>СКОРЕЕ ПРИЕЗЖАЙ КО МНЕ 💖</p>
<p>Я ЖДУ ТЕБЯ, HUBBY!!!</p>
</div>
<div class="nav-btns">
<button class="btn" onclick="prevSlide()">⬅</button>
</div>
</div>

</div>

<button id="musicToggle" onclick="toggleMusic()">▶ Play Music</button>

<script>
let currentSlide=1;
function showSlide(n){
document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));
document.getElementById('slide'+n).classList.add('active');
currentSlide=n;
}

function nextSlide(){if(currentSlide<5) showSlide(currentSlide+1);}
function prevSlide(){if(currentSlide>1) showSlide(currentSlide-1);}

function pressNum(n){
const inputs=document.querySelectorAll('.pin-box input');
for(let i of inputs){if(i.value===""){i.value=n; break;}}
}

function deleteNum(){
const inputs=document.querySelectorAll('.pin-box input');
for(let i=inputs.length-1;i>=0;i--){if(inputs[i].value!==""){inputs[i].value=""; break;}}
}

function checkPin(){
const pin=[...document.querySelectorAll('.pin-box input')].map(i=>i.value).join('');
if(pin==="2003"){showSlide(2);}
else document.getElementById("errorMsg").innerText="Неверный PIN!";
}

let audio=new Audio("musik.mp3");
audio.loop=true;
let playing=false;

function toggleMusic(){
if(playing){audio.pause(); playing=false;}
else{audio.play(); playing=true;}
}
</script>

</body>
</html>
